# Label Tape Systems website: Portainer stack (Git repository) behind Nginx Proxy Manager.
#
# GitHub Actions builds the image, pushes it to GHCR, and updates the tag below.
# That commit triggers Portainer's GitOps polling to redeploy. Don't edit the image line by hand.
# The container joins NPM's Docker network and publishes NO ports.
#
# Portainer stack environment variable required:
#   NPM_NETWORK = the Docker network your Nginx Proxy Manager container is on
#
# Local preview (temporary Cloudflare link):
#   docker compose -f docker-compose.preview.yml up -d --build

services:
  web:
    image: ghcr.io/ijerimy/labelandtapesystems:latest
    container_name: lts-website
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [npm]

networks:
  npm:
    external: true
    name: ${NPM_NETWORK:?Set NPM_NETWORK in the Portainer stack environment variables}
