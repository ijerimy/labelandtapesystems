# Builds the site image on every push to main, publishes it to GitHub Container Registry (private),
# then pins docker-compose.yml to the new image tag and commits it.
# That commit is what Portainer's GitOps polling sees, so it redeploys only after the image exists.
name: Build and publish image

on:
  push:
    branches: [main]
    paths-ignore: ["docker-compose.yml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/ijerimy/labelandtapesystems

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # arm64 build for Oracle Ampere VMs
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin docker-compose.yml to this image
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${GITHUB_SHA}|" docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy image ${GITHUB_SHA::7}"
          git push
