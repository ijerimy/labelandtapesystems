# Clean URLs: pages are served without ".html". Any .html link (old Homestead pages,
# old bookmarks, the previous version of this site) gets one 301 to the clean address.
# Matched on $request_uri (what the visitor typed), so nginx's own internal lookups are never redirected.
map $request_uri $lts_redirect {
    default "";
    ~*^/just_ask\.html        /customers;
    ~*^/how_it_works\.html    /laundry-labeling-systems;
    ~*^/page04\.html          "/laundry-labeling-systems#print-options";
    ~*^/kits\.html            /vision-id-kit;
    ~*^/warranties\.html      /support;
    ~*^/page05\.html          /order;
    ~*^/contact-us\.html      /order;
    ~*^/denture-id-kit         /vision-id-kit;
    ~^/index(\.html)?$        /;
    ~^/(?<lts_page>[a-z0-9-]+)\.html$  /$lts_page;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    if ($lts_redirect) { return 301 $lts_redirect; }

    server_tokens off;
    absolute_redirect off;   # redirects stay relative, so they work behind the Cloudflare tunnel

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # PREVIEW ONLY: keep the temporary site out of search engines. Remove this line at launch.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    location ~* \.(css|js|svg|jpg|jpeg|png|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = / { try_files /index.html =404; }
    location / { try_files $uri $uri.html =404; }
}
