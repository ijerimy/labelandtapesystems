server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    server_tokens off;
    absolute_redirect off;   # redirects stay relative, so they work behind the Cloudflare tunnel

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # PREVIEW ONLY: keep the temporary site out of search engines. Remove this line at launch.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Old Homestead page URLs -> new pages (keeps existing links and search results working)
    location = /Just_Ask.html       { return 301 /customers.html; }
    location = /How_it_Works.html   { return 301 /laundry-labeling-systems.html; }
    location = /page04.html         { return 301 /laundry-labeling-systems.html#print-options; }
    location = /Kits.html           { return 301 /vision-id-kit.html; }
    location = /Warranties.html     { return 301 /support.html; }
    location = /page05.html         { return 301 /order.html; }
    location = /Contact-us.html     { return 301 /order.html; }
    # /about.html and /index.html keep the same names on the new site

    location ~* \.(css|js|svg|jpg|jpeg|png|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / { try_files $uri $uri.html $uri/ =404; }
}
